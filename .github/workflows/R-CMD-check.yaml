# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Pull requests run the three current-release jobs, which are the checks
# that auto-merge requires. They run whatever the base branch, so a stacked
# pull request already has them when GitHub retargets it to main. Pushes to
# main, the weekly schedule and manual runs also check R-devel and the
# previous release (oldrel-1). A new push to a pull request cancels the run
# for its older commit. Every other run has its own concurrency group, so
# none is cancelled.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"release"}]' || '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]') }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # Use PPM on macOS too, avoiding CRAN binaries with unsupported compression.
          use-public-rspm: always

      # R-devel breaks packages before CRAN catches up, so a failure there,
      # in the dependencies or in the check, is reported in the log as a
      # warning instead of failing the job.
      - uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: ${{ matrix.config.r == 'devel' }}
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        continue-on-error: ${{ matrix.config.r == 'devel' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
