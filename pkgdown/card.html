<!doctype html>
<!-- The social card of the website, drawn to pkgdown/assets/card.png by
     pkgdown/brand.R. The colours are the brand colours of pkgdown/extra.css. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=JetBrains+Mono:wght@400&family=Source+Sans+3:wght@400&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    gap: 64px;
    box-sizing: border-box;
    padding: 0 80px 10px;
    background: radial-gradient(circle at 25% 40%, #06365f 0%, #022345 60%);
    color: #fff;
    position: relative;
  }
  body::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 12px;
    background: linear-gradient(90deg, #6bc673, #f6c31f 40%, #fb6f14 70%, #ed1a0b);
  }
  img {
    height: 430px;
    flex: none;
  }
  h1 {
    margin: 0 0 18px;
    font: 700 112px/1 "Inter", sans-serif;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0 0 34px;
    font: 400 40px/1.3 "Source Sans 3", sans-serif;
    color: #d4e3ef;
  }
  .url {
    font: 400 26px/1 "JetBrains Mono", monospace;
    color: #6db7e3;
  }
</style>
</head>
<body>
  <img src="../man/figures/logo.png" alt="">
  <div>
    <h1>RiskMap</h1>
    <p>Model-based geostatistics in R, from surveys at scattered locations to maps of disease risk.</p>
    <div class="url">claudiofronterre.github.io/RiskMap</div>
  </div>
</body>
</html>
