<!doctype html>
<!-- The social card of the website, drawn to pkgdown/assets/card.png by
     make_card() in pkgdown/brand.R, which puts the sticker next to this file
     as sticker.png. The colours are the brand colours of pkgdown/extra.css. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:wght@700&family=JetBrains+Mono:wght@400&family=Source+Sans+3:wght@400&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    gap: 70px;
    box-sizing: border-box;
    padding: 0 90px 16px;
    background: #f5efe3;
    color: #1d3557;
    position: relative;
  }
  body::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16px;
    background: linear-gradient(90deg,
      #bfc6cf 0 20%, #ecd5c6 20% 36%, #dfb09b 36% 52%,
      #d28a70 52% 68%, #c66749 68% 84%, #bf5230 84% 100%);
  }
  img {
    height: 450px;
    flex: none;
  }
  h1 {
    margin: 0 0 20px;
    font: 700 120px/1 "Libertinus Serif", serif;
  }
  p {
    margin: 0 0 36px;
    font: 400 40px/1.3 "Source Sans 3", sans-serif;
  }
  .url {
    font: 400 26px/1 "JetBrains Mono", monospace;
    color: #a8452a;
  }
</style>
</head>
<body>
  <img src="sticker.png" alt="">
  <div>
    <h1>RiskMap</h1>
    <p>Model-based geostatistics in R, from surveys at scattered locations to maps of disease risk.</p>
    <div class="url">claudiofronterre.github.io/RiskMap</div>
  </div>
</body>
</html>
